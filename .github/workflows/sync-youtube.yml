name: Sync YouTube long videos

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch YouTube long videos and sync site
        shell: python
        run: |
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          channel_id = "UCsLXYCY4hBjGyJLm8qhAByQ"
          feed_url = f"https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}"
          with urllib.request.urlopen(feed_url, timeout=30) as response:
              root = ET.fromstring(response.read())

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015",
          }

          feed_entries = []
          feed_by_id = {}
          for entry in root.findall("atom:entry", ns):
              video_id = entry.findtext("yt:videoId", default="", namespaces=ns)
              title = entry.findtext("atom:title", default="", namespaces=ns)
              published = entry.findtext("atom:published", default="", namespaces=ns)
              if not video_id:
                  continue
              item = {"id": video_id, "title": title, "published": published}
              feed_entries.append(item)
              feed_by_id[video_id] = item

          def is_short(video_id):
              req = urllib.request.Request(
                  f"https://www.youtube.com/shorts/{video_id}",
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      final_url = response.geturl()
                  return "/shorts/" in final_url
              except Exception as exc:
                  print(f"Skipping {video_id}: could not verify long-form status: {exc}")
                  return True

          json_path = Path("youtube-videos.json")
          videos = json.loads(json_path.read_text(encoding="utf-8")) if json_path.exists() else []

          unique = []
          seen = set()
          for item in videos:
              video_id = item.get("id")
              if not video_id or video_id in seen:
                  continue
              seen.add(video_id)
              # Backfill missing titles/dates from the current YouTube RSS feed.
              feed_item = feed_by_id.get(video_id)
              if feed_item:
                  if not (item.get("title") or "").strip():
                      item["title"] = feed_item.get("title") or f"YouTube video {video_id}"
                  if not item.get("added") and feed_item.get("published"):
                      item["added"] = feed_item["published"][:10]
              if not (item.get("title") or "").strip():
                  item["title"] = f"YouTube video {video_id}"
              unique.append(item)
          videos = unique

          new_items = []
          for entry in feed_entries:
              video_id = entry["id"]
              title = entry["title"]
              published = entry["published"]
              if video_id in seen:
                  continue
              if is_short(video_id):
                  print(f"Ignoring Short: {video_id} — {title}")
                  continue
              added = published[:10] if published else datetime.now(timezone.utc).date().isoformat()
              new_items.append({"id": video_id, "title": title or f"YouTube video {video_id}", "added": added})
              seen.add(video_id)

          if new_items:
              videos.extend(new_items)
              print(f"Added {len(new_items)} new long video(s).")
          else:
              print("No new long videos.")

          # Always show newest videos first on the site. Items without a date go last.
          videos.sort(key=lambda item: item.get("added") or "0000-00-00", reverse=True)

          json_path.write_text(json.dumps(videos, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          def js_string(value):
              return json.dumps(value or "", ensure_ascii=False)

          rows = []
          for item in videos:
              fields = [f"id: {js_string(item.get('id'))}", f"title: {js_string(item.get('title'))}"]
              if item.get("added"):
                  fields.append(f"added: {js_string(item.get('added'))}")
              rows.append("    { " + ", ".join(fields) + " },")
          new_block = "  const YOUTUBE_VIDEOS = [\n" + "\n".join(rows) + "\n  ];"

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")
          pattern = r"  const YOUTUBE_VIDEOS = \[.*?\n  \];"
          updated, count = re.subn(pattern, lambda m: new_block, html, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError("Could not find exactly one YOUTUBE_VIDEOS block in index.html")
          index_path.write_text(updated, encoding="utf-8")

      - name: Commit updated YouTube data
        run: |
          if git diff --quiet -- youtube-videos.json index.html; then
            echo "Nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add youtube-videos.json index.html
            git commit -m "Auto-sync YouTube long videos"
            git push
          fi

      - name: Trigger GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
