<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Imastun — Imastun Studio</title>
  <meta name="description" content="Imastun-ի հեղինակային երգերն ու բազմալեզու երաժշտական նախագծերը։">
  <meta name="theme-color" content="#0c0b09">
  <link rel="canonical" href="https://imastun.org/imastun.html">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500;1,600&family=Noto+Serif+Armenian:wght@400;600;700&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      color-scheme:dark;
      --bg:#080808;
      --surface:#0f0f0f;
      --surface-2:#161616;
      --surface-3:#1d1b17;
      --text:#e8e2d5;
      --white:#f5f0e8;
      --muted:#7a7468;
      --gold:#c9a84c;
      --gold-2:#e8c97a;
      --gold-dim:rgba(201,168,76,.10);
      --border:rgba(201,168,76,.15);
      --safe-bottom:env(safe-area-inset-bottom,0px)
    }
    body.light-mode{
      color-scheme:light;
      --bg:#f3eee3;
      --surface:#fffaf1;
      --surface-2:#ede4d3;
      --surface-3:#e4d7c1;
      --text:#2a241a;
      --white:#1d1811;
      --muted:#756957;
      --border:rgba(122,91,29,.22);
      --gold-dim:rgba(160,112,25,.09)
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:'Syne',Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
      transition:background .25s,color .25s
    }
    body.player-open{padding-bottom:calc(108px + var(--safe-bottom))}
    button,input,a{font:inherit}
    button{color:inherit}
    a{color:inherit;text-decoration:none}
    button:focus-visible,a:focus-visible,input:focus-visible{
      outline:2px solid var(--gold-2);
      outline-offset:3px
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:50;
      height:64px;
      border-bottom:1px solid var(--border);
      background:color-mix(in srgb,var(--bg) 94%,transparent);
      backdrop-filter:blur(18px)
    }
    .topbar-inner{
      width:100%;
      height:64px;
      padding:0 clamp(14px,5vw,80px);
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:16px
    }
    .back{
      justify-self:start;
      display:inline-flex;
      align-items:center;
      gap:9px;
      min-height:40px;
      color:var(--muted);
      font-size:10px;
      font-weight:600;
      letter-spacing:.16em;
      text-transform:uppercase
    }
    .back b{font-size:20px;font-weight:400;color:var(--gold)}
    .back:hover{color:var(--gold-2)}
    .brand{
      text-align:center;
      font-family:'Cormorant Garamond',Georgia,serif;
      font-style:italic;
      letter-spacing:.08em
    }
    .brand strong{display:block;color:var(--gold-2);font-size:22px;font-weight:600;line-height:.9}
    .brand small{
      display:block;
      margin-top:3px;
      color:var(--muted);
      font:600 8px 'Syne',sans-serif;
      letter-spacing:.24em;
      text-transform:uppercase
    }
    .controls{justify-self:end;display:flex;align-items:center;gap:10px}
    .lang{
      display:flex;
      border:1px solid var(--border);
      background:var(--surface);
      padding:2px
    }
    .lang button{
      min-width:45px;
      height:34px;
      padding:0 9px;
      border:0;
      background:transparent;
      color:var(--muted);
      font-size:10px;
      font-weight:700;
      cursor:pointer
    }
    .lang button[aria-pressed="true"]{background:var(--gold);color:#0c0c0c}
    .theme{
      width:40px;
      height:40px;
      border:1px solid var(--border);
      border-radius:50%;
      background:transparent;
      color:var(--gold-2);
      cursor:pointer;
      font-size:18px
    }

    main{
      width:min(1100px,calc(100% - 32px));
      margin:0 auto;
      padding:30px 0 54px
    }
    .hero{
      display:grid;
      grid-template-columns:minmax(300px,1fr) minmax(0,1fr);
      grid-template-areas:
        "cover heading"
        "cover intro"
        "cover actions";
      background:var(--surface-2);
      border:1px solid var(--border);
      overflow:hidden
    }
    .cover-wrap{
      grid-area:cover;
      position:relative;
      min-height:430px;
      overflow:hidden;
      background:#0a0a0a
    }
    .cover{
      display:block;
      width:100%;
      height:100%;
      min-height:430px;
      object-fit:cover;
      object-position:top center;
      opacity:.72
    }
    .cover-wrap::after{
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(90deg,transparent 65%,rgba(15,15,15,.28))
    }
    .cover-mark{display:none}
    .hero>div:nth-child(2){
      grid-area:heading;
      padding:38px clamp(24px,4vw,48px) 10px
    }
    .eyebrow{
      margin:0 0 10px;
      color:var(--gold);
      font-size:10px;
      font-weight:700;
      letter-spacing:.3em;
      text-transform:uppercase
    }
    h1{
      margin:0;
      color:var(--gold-2);
      font-family:'Cormorant Garamond',Georgia,serif;
      font-size:clamp(46px,7vw,76px);
      font-weight:500;
      font-style:italic;
      line-height:.9
    }
    .role{
      margin:16px 0 0;
      color:var(--muted);
      font-size:10px;
      font-weight:600;
      letter-spacing:.2em;
      line-height:1.65;
      text-transform:uppercase
    }
    .intro{
      grid-area:intro;
      align-self:start;
      margin:0;
      padding:6px clamp(24px,4vw,48px);
      color:var(--text);
      font-family:'Noto Serif Armenian','Cormorant Garamond',Georgia,serif;
      font-size:18px;
      line-height:1.7
    }
    .hero-actions{
      grid-area:actions;
      align-self:end;
      display:flex;
      align-items:center;
      gap:18px;
      padding:20px clamp(24px,4vw,48px) 38px
    }
    .primary{
      min-height:40px;
      padding:0 18px;
      border:1px solid var(--gold);
      background:transparent;
      color:var(--gold-2);
      cursor:pointer;
      font-size:10px;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase
    }
    .primary:hover{background:var(--gold);color:#0c0c0c}
    .stat{color:var(--muted);font-size:11px;letter-spacing:.08em}

    .catalog{margin-top:30px}
    .catalog-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      margin-bottom:16px;
      padding-bottom:12px;
      border-bottom:1px solid var(--border)
    }
    .catalog h2{
      margin:0;
      color:var(--gold);
      font-family:'Cormorant Garamond',Georgia,serif;
      font-size:30px;
      font-weight:500;
      font-style:italic
    }
    .count{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
    .toolbar{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:12px;
      margin-bottom:16px
    }
    .search{position:relative}
    .search::before{
      content:'⌕';
      position:absolute;
      left:13px;
      top:50%;
      transform:translateY(-52%);
      color:var(--muted);
      font-size:20px;
      pointer-events:none
    }
    .search input{
      width:100%;
      height:42px;
      padding:0 14px 0 40px;
      border:1px solid var(--border);
      border-radius:0;
      outline:0;
      background:var(--surface);
      color:var(--text);
      font-size:13px
    }
    .search input:focus{border-color:var(--gold)}
    .search input::placeholder{color:var(--muted)}
    .filters{
      display:flex;
      border-bottom:1px solid var(--border)
    }
    .filter{
      border:0;
      border-bottom:2px solid transparent;
      margin-bottom:-1px;
      padding:0 18px;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
      font-size:10px;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase
    }
    .filter.active{border-bottom-color:var(--gold);color:var(--gold)}

    .track-list{display:flex;flex-direction:column;gap:4px}
    .track-row{
      display:grid;
      grid-template-columns:28px minmax(0,1fr) 34px 34px 32px;
      align-items:center;
      gap:12px;
      min-height:54px;
      padding:10px 16px;
      border:1px solid transparent;
      border-radius:2px;
      background:rgba(255,255,255,.02);
      transition:background .2s,border-color .2s
    }
    body.light-mode .track-row{background:rgba(75,54,20,.025)}
    .track-row:hover{background:rgba(201,168,76,.05);border-color:var(--border)}
    .track-row.playing{background:var(--gold-dim);border-color:rgba(201,168,76,.3)}
    .track-num{
      color:var(--muted);
      font-size:11px;
      text-align:right;
      font-variant-numeric:tabular-nums
    }
    .track-row.playing .track-num{color:var(--gold)}
    .track-main{
      min-width:0;
      padding:2px 0;
      border:0;
      background:transparent;
      text-align:left;
      cursor:pointer
    }
    .track-title{
      display:block;
      color:var(--white);
      font-family:'Noto Serif Armenian','Cormorant Garamond',Georgia,serif;
      font-size:17px;
      font-weight:600;
      line-height:1.35;
      white-space:normal;
      overflow:visible;
      overflow-wrap:anywhere
    }
    .track-row.playing .track-title{color:var(--gold-2)}
    .track-sub{
      display:block;
      margin-top:3px;
      color:var(--muted);
      font-size:9px;
      font-weight:600;
      letter-spacing:.12em;
      text-transform:uppercase
    }
    .icon-btn,.track-play{
      display:flex;
      align-items:center;
      justify-content:center;
      width:32px;
      height:32px;
      padding:0;
      border:0;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
      font-size:18px
    }
    .icon-btn:hover,.icon-btn.favorite{color:var(--gold-2)}
    .share-svg{
      display:block;
      width:18px;
      height:18px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.7;
      stroke-linecap:round;
      stroke-linejoin:round
    }
    .track-play{
      border:1px solid var(--border);
      border-radius:50%;
      color:var(--gold);
      font-size:10px
    }
    .track-play:hover,.track-row.playing .track-play{
      border-color:var(--gold);
      background:var(--gold-dim)
    }
    .track-actions{display:contents}
    .empty{
      padding:30px 16px;
      border:1px solid var(--border);
      color:var(--muted);
      text-align:center;
      font-size:13px
    }
    footer{padding:30px 0 0;color:var(--muted);font-size:10px;letter-spacing:.12em;text-align:center}

    .player{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:1000;
      visibility:hidden;
      transform:translateY(110%);
      transition:transform .25s ease,visibility .25s;
      padding:12px clamp(14px,4vw,52px) calc(12px + var(--safe-bottom));
      border-top:1px solid rgba(201,168,76,.42);
      background:
        radial-gradient(circle at 18% 0%,rgba(201,168,76,.12),transparent 34%),
        color-mix(in srgb,var(--surface) 97%,transparent);
      backdrop-filter:blur(24px);
      box-shadow:0 -14px 40px rgba(0,0,0,.34)
    }
    .player::before{
      content:'';
      position:absolute;
      left:0;
      right:0;
      top:-1px;
      height:1px;
      background:linear-gradient(90deg,transparent,var(--gold-2),transparent);
      pointer-events:none
    }
    .player.visible{visibility:visible;transform:none}
    .player-inner{
      position:relative;
      width:min(1060px,100%);
      margin:auto;
      display:grid;
      grid-template-columns:54px minmax(140px,1fr) auto minmax(180px,.85fr) 34px;
      align-items:center;
      gap:14px
    }
    .player-cover{
      width:54px;
      height:54px;
      object-fit:cover;
      border:1px solid rgba(201,168,76,.55);
      border-radius:11px
    }
    .player-meta{min-width:0}
    .player-title{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      color:var(--white);
      font-family:'Noto Serif Armenian','Cormorant Garamond',Georgia,serif;
      font-size:18px;
      font-weight:600
    }
    .player-status{margin-top:4px;color:var(--muted);font-size:10px}
    .player-controls{display:flex;align-items:center;gap:6px}
    .player-controls button{
      display:flex;
      align-items:center;
      justify-content:center;
      width:36px;
      height:36px;
      padding:0;
      border:0;
      border-radius:50%;
      background:transparent;
      color:var(--text);
      cursor:pointer
    }
    .player-controls .main-play{
      width:46px;
      height:46px;
      border:1px solid var(--gold);
      background:var(--gold);
      color:#0c0c0c;
      font-size:14px
    }
    .player-progress{
      display:grid;
      grid-template-columns:36px 1fr 36px;
      align-items:center;
      gap:8px
    }
    .player-progress span{color:var(--muted);font-size:9px;text-align:center}
    .player-progress input{width:100%;accent-color:var(--gold);cursor:pointer}
    .player-close{
      width:34px;
      height:34px;
      padding:0;
      border:0;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
      font-size:24px
    }
    .toast{
      position:fixed;
      left:50%;
      bottom:calc(105px + var(--safe-bottom));
      z-index:1200;
      max-width:calc(100% - 30px);
      padding:10px 15px;
      transform:translate(-50%,18px);
      border:1px solid var(--border);
      background:var(--surface-2);
      color:var(--text);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s,transform .2s;
      font-size:12px
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media(max-width:700px){
      body.player-open{padding-bottom:calc(118px + var(--safe-bottom))}
      .topbar-inner{
        padding:0 12px;
        grid-template-columns:auto minmax(72px,1fr) auto;
        gap:10px
      }
      .back{
        width:40px;
        height:40px;
        justify-content:center
      }
      .back span{display:none}
      .back b{font-size:22px}
      .brand{justify-self:start;text-align:left}
      .brand strong{font-size:20px}
      .brand small{font-size:7px}
      .controls{gap:7px}
      .lang button{min-width:40px;height:32px;padding:0 6px;font-size:9px}
      .theme{width:38px;height:38px}
      main{width:100%;padding:18px 0 42px}
      .hero{
        grid-template-columns:1fr;
        grid-template-areas:
          "cover"
          "heading"
          "intro"
          "actions";
        border-left:0;
        border-right:0
      }
      .cover-wrap{height:190px;min-height:190px}
      .cover{height:190px;min-height:190px;object-fit:cover;object-position:center 28%}
      .cover-wrap::after{background:linear-gradient(180deg,transparent 55%,rgba(15,15,15,.28))}
      .hero>div:nth-child(2){padding:11px 12px 3px}
      .eyebrow{display:none}
      h1{font-size:32px}
      .role{margin-top:5px;font-size:8px;letter-spacing:.13em;line-height:1.45}
      .intro{display:none}
      .hero-actions{padding:7px 12px 10px;gap:12px}
      .primary{min-height:32px;padding:0 10px;font-size:8.5px;letter-spacing:.07em}
      .catalog{margin-top:12px;padding:0 8px}
      .catalog-head{margin-bottom:8px;padding-bottom:8px}
      .catalog h2{font-size:22px}
      .toolbar{grid-template-columns:1fr;gap:6px;margin-bottom:8px}
      .search input{height:36px;padding-left:36px}
      .search::before{left:11px;font-size:18px}
      .filters{height:34px}
      .filter{flex:1;padding:0 8px;font-size:9px}
      .track-list{padding:0 2px}
      .track-row{
        grid-template-columns:24px minmax(0,1fr) 30px 30px 30px;
        gap:7px;
        min-height:46px;
        padding:7px 6px
      }
      .track-title{font-size:15px}
      .track-sub{font-size:8px}
      .icon-btn,.track-play{width:30px;height:30px}
      footer{padding-inline:12px}
      .player{padding:9px 12px calc(8px + var(--safe-bottom))}
      .player-inner{
        grid-template-columns:42px minmax(0,1fr) auto 28px;
        grid-template-areas:
          "cover meta controls close"
          "progress progress progress progress";
        gap:7px 10px
      }
      .player-cover{grid-area:cover;width:42px;height:42px;border-radius:9px}
      .player-meta{grid-area:meta}
      .player-title{font-size:15px}
      .player-controls{grid-area:controls;gap:1px}
      .player-controls button{width:28px;height:28px}
      .player-controls .main-play{width:38px;height:38px}
      .player-progress{grid-area:progress;grid-template-columns:32px 1fr 32px;gap:6px}
      .player-close{grid-area:close;width:28px;height:28px}
      .toast{bottom:calc(116px + var(--safe-bottom))}
    }
    @media(max-width:420px){
      .topbar-inner{gap:6px;padding:0 8px}
      .brand strong{font-size:17px}
      .brand small{display:none}
      .controls{gap:5px}
      .lang button{min-width:35px;padding:0 4px}
      .theme{width:34px;height:34px}
      .track-row{grid-template-columns:22px minmax(0,1fr) 28px 28px 28px;gap:5px;padding-inline:5px}
      .icon-btn,.track-play{width:28px;height:28px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="back" href="index.html#artists" aria-label="Գլխավոր էջ"><b aria-hidden="true">←</b><span data-i18n="back">Գլխավոր էջ</span></a>
      <a class="brand" href="index.html"><strong>IMASTUN</strong><small>Studio</small></a>
      <div class="controls">
        <div class="lang" role="group" aria-label="Փոխել լեզուն">
          <button type="button" data-lang="hy" aria-pressed="true">Հայ</button>
          <button type="button" data-lang="ru" aria-pressed="false">Рус</button>
          <button type="button" data-lang="en" aria-pressed="false">Eng</button>
        </div>
        <button class="theme" id="theme-toggle" type="button" aria-label="Փոխել գունային ռեժիմը">☾</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="artist-name">
      <div class="cover-wrap">
        <img class="cover" src="authors/imastun/cover.jpg" alt="Imastun" width="500" height="500" fetchpriority="high">
        <span class="cover-mark" aria-hidden="true">IS</span>
      </div>
      <div>
        <p class="eyebrow">Imastun Studio</p>
        <h1 id="artist-name">Imastun</h1>
        <p class="role" data-i18n="role">Բանաստեղծ • արտիստ • պրոդյուսեր</p>
      </div>
      <p class="intro" data-i18n="intro">Imastun-ի հեղինակային երգերն ու բազմալեզու երաժշտական նախագծերը՝ մեկ առանձին, թեթև էջում։</p>
      <div class="hero-actions">
        <button class="primary" id="play-first" type="button"><span aria-hidden="true">▶</span> <span data-i18n="playFirst">Նվագարկել առաջին երգը</span></button>
        <span class="stat">46 <span data-i18n="songWord">երգ</span></span>
      </div>
    </section>

    <section class="catalog" aria-labelledby="catalog-title">
      <div class="catalog-head">
        <h2 id="catalog-title" data-i18n="catalog">Երգացանկ</h2>
        <span class="count" id="result-count">46 երգ</span>
      </div>
      <div class="toolbar">
        <label class="search">
          <span style="position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden" data-i18n="search">Որոնել երգերում…</span>
          <input id="search" type="search" autocomplete="off" data-i18n-placeholder="search" placeholder="Որոնել երգերում…">
        </label>
        <div class="filters" role="group" aria-label="Երգերի զտիչ">
          <button class="filter active" type="button" data-filter="all" data-i18n="all">Բոլորը</button>
          <button class="filter" type="button" data-filter="favorites" data-i18n="favorites">Սիրված երգերը</button>
        </div>

      empty.hidden = items.length !== 0;
      empty.textContent = state.filter === "favorites" && !state.query ? tr("noFavorites") : tr("noResults");
      list.innerHTML = items.map(function (item) {
        var favorite = isFavorite(item.track.id);
        var playing = state.current === item.index && !audio.paused;
        return '<article class="track-row' + (state.current === item.index ? ' playing' : '') + '" data-index="' + item.index + '">' +
          '<span class="track-num">' + String(item.index + 1).padStart(2, "0") + '</span>' +
          '<button class="track-main" type="button" data-action="play">' +
          '<span class="track-title">' + escapeHtml(item.track.label) + '</span>' +
          '<span class="track-sub">Imastun</span></button>' +
          '<button class="icon-btn' + (favorite ? ' favorite' : '') + '" type="button" data-action="favorite" aria-label="' +
          escapeHtml(favorite ? tr("unfavorite") : tr("favorite")) + '">' + (favorite ? "♥" : "♡") + '</button>' +
          '<button class="icon-btn share-btn" type="button" data-action="share" aria-label="' + escapeHtml(tr("share")) + '">' +
          '<svg class="share-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
          '<circle cx="18" cy="5" r="2.2"></circle><circle cx="6" cy="12" r="2.2"></circle><circle cx="18" cy="19" r="2.2"></circle>' +
          '<path d="M8 11l7.8-4.7M8 13l7.8 4.7"></path></svg></button>' +
          '<button class="track-play" type="button" data-action="play" aria-label="' + escapeHtml(playing ? tr("pause") : tr("play")) + '">' +
          (playing ? "❚❚" : "▶") + '</button></article>';
      }).join("");
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
      var minutes = Math.floor(seconds / 60);
      var rest = Math.floor(seconds % 60);
      return minutes + ":" + String(rest).padStart(2, "0");
    }

    function setStatus(key) {
      playerStatus.textContent = tr(key);
    }

    function syncPlayer() {
      var active = state.current >= 0 ? TRACKS[state.current] : null;
      var playing = active && !audio.paused;
      playButton.textContent = playing ? "❚❚" : "▶";
      playButton.setAttribute("aria-label", tr(playing ? "pause" : "play"));
      document.getElementById("prev").setAttribute("aria-label", tr("previous"));
      document.getElementById("next").setAttribute("aria-label", tr("next"));
      document.getElementById("player-close").setAttribute("aria-label", tr("close"));
      renderTracks();
    }

    function showPlayer() {
      player.classList.add("visible");
      document.body.classList.add("player-open");
    }

    function loadTrack(index, autoplay) {
      if (index < 0 || index >= TRACKS.length) return;
      state.current = index;
      var track = TRACKS[index];

      showPlayer();
      playerTitle.textContent = track.label;
      document.getElementById("player-cover").src = "authors/imastun/cover.jpg";
      progress.value = "0";
      currentTime.textContent = "0:00";
      duration.textContent = "0:00";
      setStatus("loading");

      if (audio.src !== track.src) {
        audio.src = track.src;
        audio.load();
      }

      write("imastun_last_track", JSON.stringify({
        artistId: "imastun", song: track.id, label: track.label, artistName: "Imastun"
      }));

      if ("mediaSession" in navigator && "MediaMetadata" in window) {
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: track.label,
            artist: "Imastun",
            album: "Imastun Studio",
            artwork: [{ src: new URL("authors/imastun/cover.jpg", location.href).href, sizes: "500x500", type: "image/jpeg" }]
          });
        } catch (error) {}
      }

      syncPlayer();
      if (autoplay) {
        var promise = audio.play();
        if (promise && promise.catch) {
          promise.catch(function () {
            setStatus("ready");
            showToast(tr("tapAgain"));
            syncPlayer();
          });
        }
      }
    }

    function togglePlay(index) {
      if (state.current !== index) {
        loadTrack(index, true);
        return;
      }
      if (audio.paused) {
        var promise = audio.play();
        if (promise && promise.catch) promise.catch(function () { showToast(tr("tapAgain")); });
      } else {
        audio.pause();
      }
    }

    function move(direction) {
      if (state.current < 0) {
        loadTrack(direction > 0 ? 0 : TRACKS.length - 1, true);
        return;
      }
      var next = (state.current + direction + TRACKS.length) % TRACKS.length;
      loadTrack(next, true);
    }

    function shareTrack(index) {
      var track = TRACKS[index];
      var url = new URL("imastun.html", location.href);
      url.searchParams.set("play", "imastun|" + track.id);
      var data = { title: track.label, text: track.label + " — Imastun", url: url.href };

      if (navigator.share) {
        navigator.share(data).catch(function () {});
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url.href).then(function () {
          showToast(tr("copied"));
        }).catch(function () {
          showToast(tr("copyFailed"));
        });
        return;
      }
      showToast(url.href);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
    }

    function applyLanguage(lang) {
      state.lang = I18N[lang] ? lang : "hy";
      document.documentElement.lang = state.lang;
      write("imastun_language", state.lang);
      document.querySelectorAll("[data-lang]").forEach(function (button) {
        var active = button.dataset.lang === state.lang;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      document.querySelectorAll("[data-i18n]").forEach(function (element) {
        element.textContent = tr(element.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(function (element) {
        element.placeholder = tr(element.dataset.i18nPlaceholder);
      });
      document.querySelector(".lang").setAttribute("aria-label", tr("language"));
      document.getElementById("theme-toggle").setAttribute("aria-label", tr("theme"));
      setStatus(audio.paused ? (state.current >= 0 ? "paused" : "ready") : "playing");
      syncPlayer();
    }

    list.addEventListener("click", function (event) {
      var button = event.target.closest("[data-action]");
      var row = event.target.closest(".track-row");
      if (!button || !row) return;
      var index = Number(row.dataset.index);
      if (button.dataset.action === "play") togglePlay(index);
      else if (button.dataset.action === "favorite") toggleFavorite(TRACKS[index].id);
      else if (button.dataset.action === "share") shareTrack(index);
    });

    search.addEventListener("input", function () {
      state.query = search.value;
      renderTracks();
    });

    document.querySelectorAll("[data-filter]").forEach(function (button) {
      button.addEventListener("click", function () {
        state.filter = button.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach(function (candidate) {
          candidate.classList.toggle("active", candidate === button);
        });
        renderTracks();
      });
    });

    document.querySelectorAll("[data-lang]").forEach(function (button) {
      button.addEventListener("click", function () { applyLanguage(button.dataset.lang); });
    });

    document.getElementById("play-first").addEventListener("click", function () { loadTrack(0, true); });
    playButton.addEventListener("click", function () {
      if (state.current < 0) loadTrack(0, true);
      else togglePlay(state.current);
    });
    document.getElementById("prev").addEventListener("click", function () { move(-1); });
    document.getElementById("next").addEventListener("click", function () { move(1); });
    document.getElementById("player-close").addEventListener("click", function () {
      audio.pause();
      player.classList.remove("visible");
      document.body.classList.remove("player-open");
    });

    progress.addEventListener("input", function () {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime = (Number(progress.value) / 1000) * audio.duration;
      }
    });

    audio.addEventListener("play", function () { setStatus("playing"); syncPlayer(); });
    audio.addEventListener("pause", function () {
      if (!audio.ended && state.current >= 0) setStatus("paused");
      syncPlayer();
    });
    audio.addEventListener("waiting", function () { setStatus("loading"); });
    audio.addEventListener("canplay", function () {
      if (audio.paused) setStatus("ready");
    });
    audio.addEventListener("loadedmetadata", function () {
      duration.textContent = formatTime(audio.duration);
    });
    audio.addEventListener("timeupdate", function () {
      currentTime.textContent = formatTime(audio.currentTime);
      duration.textContent = formatTime(audio.duration);
      progress.value = Number.isFinite(audio.duration) && audio.duration > 0
        ? String(Math.round((audio.currentTime / audio.duration) * 1000)) : "0";
    });
    audio.addEventListener("ended", function () { move(1); });
    audio.addEventListener("error", function () {
      setStatus("ready");
      showToast(tr("audioError"));
      syncPlayer();
    });

    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.setActionHandler("play", function () { if (state.current >= 0) audio.play(); });
        navigator.mediaSession.setActionHandler("pause", function () { audio.pause(); });
        navigator.mediaSession.setActionHandler("previoustrack", function () { move(-1); });
        navigator.mediaSession.setActionHandler("nexttrack", function () { move(1); });
      } catch (error) {}
    }

    document.getElementById("theme-toggle").addEventListener("click", function () {
      var next = document.body.classList.contains("light-mode") ? "dark" : "light";
      document.body.classList.toggle("light-mode", next === "light");
      document.getElementById("theme-toggle").textContent = next === "light" ? "☀" : "☾";
      write("imastun_theme", next);
    });

    var savedTheme = read("imastun_theme", "dark");
    document.body.classList.toggle("light-mode", savedTheme === "light");
    document.getElementById("theme-toggle").textContent = savedTheme === "light" ? "☀" : "☾";

    var savedLanguage = read("imastun_language", "hy");
    applyLanguage(savedLanguage);

    var requested = new URLSearchParams(location.search).get("play");
    if (requested) {
      var requestedId = requested.indexOf("imastun|") === 0 ? requested.slice(8) : requested;
      var requestedIndex = TRACKS.findIndex(function (track) { return track.id === requestedId; });
      if (requestedIndex >= 0) {
        loadTrack(requestedIndex, false);
        requestAnimationFrame(function () {
          var row = document.querySelector('.track-row[data-index="' + requestedIndex + '"]');
          if (row) row.scrollIntoView({ block: "center" });
        });
      }
    } else {
      renderTracks();
    }

    document.querySelectorAll("img").forEach(function (image) {
      image.addEventListener("error", function () { image.src = "logo.png"; }, { once: true });
    });
  })();
  </script>
</body>
</html>
